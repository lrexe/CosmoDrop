{% extends "base.html" %}
{% block title %}CosmoDrop — Рейтинг{% endblock %}

{% block content %}
<section class="page-head reveal">
    <h1>Рейтинг игроков</h1>
    <p>Лучшие коллекционеры по суммарному выигрышу.</p>
</section>

<section class="reveal" id="podium-wrap"></section>

<div class="section-head reveal"><h3>Таблица лидеров</h3></div>
<section class="rating-list reveal" id="rating-list">
    <div class="rating-item skeleton" style="height:44px"></div>
    <div class="rating-item skeleton" style="height:44px"></div>
    <div class="rating-item skeleton" style="height:44px"></div>
</section>

<section class="reveal" id="me-card" style="position:sticky;bottom:calc(var(--nav-h) + 8px);margin-top:4px"></section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/rating.js') }}"></script>
{% endblock %}
