<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vloody · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/vl-tokens.css') }}">
<script src="{{ url_for('static', filename='js/vl-theme.js') }}"></script>
<style>
/* Токены темы — static/css/vl-tokens.css (dark/light). Своих цветов здесь нет. */
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-glow) no-repeat,var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;font-size:13px;}
.hid{display:none!important;}
.mono{font-family:var(--vl-mono);font-size:12px;}
.muted{color:var(--muted);}
.pos{color:var(--success);} .neg{color:var(--danger);} .warn{color:var(--warn);}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:var(--focus);}

/* вход */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;}
#login .themebtn{position:absolute;top:16px;right:16px;}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--vl-line);border-radius:var(--r-md);padding:28px;box-shadow:var(--shadow-2);}
.logo{font-size:24px;font-weight:800;letter-spacing:.2px;}
.logo em{font-style:normal;color:var(--accent-text);}
.login-card p{color:var(--muted);font-size:13px;margin:6px 0 18px;line-height:1.5;}
.inp{width:100%;background:var(--field);border:1px solid var(--line-strong);border-radius:var(--r-sm);color:var(--text);padding:11px 12px;outline:none;}
.inp::placeholder{color:var(--muted);}
.inp:focus{border-color:var(--accent-text);}
.btn{display:inline-block;background:var(--accent-grad);border:1px solid var(--accent-2);color:var(--on-accent);font-weight:700;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;text-decoration:none;}
.btn:hover{filter:brightness(1.08);}
.btn.block{display:block;width:100%;margin-top:12px;}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--text);}
.btn.ghost:hover{border-color:var(--accent-text);color:var(--accent-text);filter:none;}
.btn.ok{background:transparent;border-color:var(--success);color:var(--success);} .btn.ok:hover{background:var(--surface-2);filter:none;}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:var(--r-sm);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px;}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-pill);color:var(--text);cursor:pointer;}
.themebtn:hover{border-color:var(--accent-text);color:var(--accent-text);}
.themebtn svg{width:18px;height:18px;}
.themebtn .i-sun{display:none;}
:root[data-theme="light"] .themebtn .i-sun{display:block;}
:root[data-theme="light"] .themebtn .i-moon{display:none;}

/* каркас */
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--vl-line);background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
header .logo{font-size:20px;}
.badge{font-family:var(--vl-mono);font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:var(--r-pill);border:1px solid var(--line-strong);color:var(--muted);}
.badge.demo{background:var(--accent-soft);border-color:var(--accent-text);color:var(--accent-text);}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;}
header .themebtn{flex:none;}
nav button{background:none;border:none;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:var(--r-sm);cursor:pointer;}
nav button:hover{color:var(--text);}
nav button.on{background:var(--accent-soft);color:var(--accent-text);}
nav button .cnt{background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;border-radius:var(--r-pill);padding:1px 6px;margin-left:5px;}
main{max-width:1180px;margin:0 auto;padding:22px 24px 60px;}
h2{font-size:20px;font-weight:700;margin-bottom:14px;}
h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:24px 0 10px;}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar .inp{max-width:280px;}
.seg{display:flex;background:var(--surface);border:1px solid var(--vl-line);border-radius:var(--r-sm);padding:3px;}
.seg button{background:none;border:none;color:var(--muted);font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;}
.seg button:hover{color:var(--text);}
.seg button.on{background:var(--surface-2);color:var(--text);}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.tile{background:var(--surface);border:1px solid var(--vl-line);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-1);}
.tile .lbl{font-size:11.5px;color:var(--muted);font-weight:600;}
.tile .val{font-family:var(--vl-mono);font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;}
.tile .val small{font-family:var(--font);font-size:12px;color:var(--muted);font-weight:600;margin-left:4px;}
.tile .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
.tile.accent{border-color:var(--accent-text);background:linear-gradient(160deg,var(--accent-soft),var(--surface));}

.tbl-wrap{background:var(--surface);border:1px solid var(--vl-line);border-radius:var(--r-md);overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:11px 14px;border-bottom:1px solid var(--vl-line);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--vl-line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
td .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
.empty{padding:28px;text-align:center;color:var(--muted);}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);border:1px solid var(--line-strong);white-space:nowrap;}
.pill.live,.pill.pending,.pill.withdraw_requested{color:var(--warn);border-color:currentColor;}
.pill.finished,.pill.paid,.pill.held{color:var(--success);border-color:currentColor;}
.pill.cancelled,.pill.rejected,.pill.banned{color:var(--danger);border-color:currentColor;}
.pill.locked{color:var(--accent-text);border-color:currentColor;}
.link{background:none;border:none;padding:0;font:inherit;text-align:inherit;color:var(--accent-text);cursor:pointer;text-decoration:none;}
.link:hover{text-decoration:underline;}
.note{background:var(--surface-2);border:1px solid var(--vl-line);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;color:var(--text);line-height:1.6;margin-bottom:14px;}
.note b{font-weight:700;}

#drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;justify-content:flex-end;}
.drawer-card{width:100%;max-width:520px;background:var(--surface);border-left:1px solid var(--vl-line);padding:22px;overflow-y:auto;color:var(--text);}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:8px;}
.kv span:nth-child(odd){color:var(--muted);}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--accent-text);color:var(--text);padding:10px 18px;border-radius:var(--r-sm);opacity:0;transition:all var(--dur) var(--ease);z-index:50;pointer-events:none;font-weight:600;box-shadow:var(--shadow-2);}
#toast.on{opacity:1;transform:translateX(-50%);}
@media(max-width:640px){header{padding:12px 14px;} main{padding:16px 14px 50px;} nav{margin-left:0;order:3;width:100%;} header .themebtn{order:2;margin-left:auto;}}
@media (prefers-reduced-motion: reduce){ #toast, #toast.on { transition: none; } .btn, .themebtn, nav button, .seg button { transition: none; } }
</style>
</head>
<body>

<div id="login">
  <button type="button" class="themebtn" data-act="theme" aria-pressed="true" aria-label="Тёмная тема" title="Сменить тему">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <form class="login-card" id="login-form">
    <div class="logo"><em>Vloody</em> · Админ</div>
    <p>Введи секрет администратора (<span class="mono">ADMIN_SECRET</span>). Он хранится только в этой вкладке и исчезает при её закрытии.</p>
    <input class="inp" id="secret" type="password" placeholder="Секрет администратора" autocomplete="current-password" autofocus>
    <button class="btn block" type="submit">Войти</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div id="panel" class="hid">
  <header>
    <div class="logo"><em>Vloody</em> · Админ</div>
    <span class="badge hid" id="demo-badge">ДЕМО-РЕЖИМ</span>
    <nav id="nav">
      <button data-tab="overview" class="on">Обзор</button>
      <button data-tab="payouts">Выводы<span class="cnt hid" id="cnt-payouts"></span></button>
      <button data-tab="pools">Раунды</button>
      <button data-tab="users">Игроки</button>
      <button data-tab="gifts">Подарки<span class="cnt hid" id="cnt-gifts"></span></button>
      <button data-tab="revenue">Доход</button>
      <button data-act="logout" class="muted">Выйти</button>
    </nav>
  <button type="button" class="themebtn" data-act="theme" aria-pressed="true" aria-label="Тёмная тема" title="Сменить тему">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  </header>
  <main id="view"></main>
</div>

<div id="drawer" class="hid"><div class="drawer-card" id="drawer-card"></div></div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => (Number(n) || 0).toLocaleString("ru-RU");
  // VDT приходит в милли (1 VDT = 1000): показываем до 3 знаков, без хвостовых нулей
  const fmtVdt = (m) => { const v = Math.abs(Number(m) || 0), w = Math.floor(v / 1000), f = String(v % 1000).padStart(3, "0").replace(/0+$/, "");
    return ((Number(m) || 0) < 0 ? "−" : "") + fmt(w) + (f ? "." + f : ""); };
  const fmtCur = (n, cur) => (cur === "VDT" ? fmtVdt(n) : fmt(n));
  const when = (ts) => ts ? new Date(ts * 1000).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
  const pill = (st, label) => `<span class="pill ${esc(st)}">${esc(label || st)}</span>`;
  const MODE = { wheel: "Колесо", vault: "Сейф", auction: "Аукцион" };
  const PO = { pending: "ожидает", paid: "выплачено", rejected: "отклонено" };
  const PL = { live: "идёт", finished: "завершён", cancelled: "отменён" };
  const GS = { held: "в инвентаре", locked: "в раунде", withdraw_requested: "ждёт выдачи", withdrawn: "выдан" };

  let secret = sessionStorage.getItem("vl_admin") || "";
  let tab = "overview", stats = null;
  const filters = { payouts: "pending", pools: "live", gifts: "withdraw_requested", users: "" };

  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }

  async function api(path, body) {
    const opts = { method: body === undefined ? "GET" : "POST", headers: { "Content-Type": "application/json", "X-Admin-Secret": secret } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch("/api/admin/" + path, opts);
    let data = null; try { data = await res.json(); } catch (e) {}
    if (res.status === 403) { logout("Сессия завершена: секрет не принят"); throw new Error("Forbidden"); }
    if (!res.ok) throw new Error((data && data.error) || "Ошибка " + res.status);
    return data;
  }

  // ---------------------------------------------------------------- тема
  function syncTheme() {
    const dark = !window.VLTheme || window.VLTheme.get() === "dark";
    document.querySelectorAll("[data-act=theme]").forEach((b) => {
      b.setAttribute("aria-pressed", dark ? "true" : "false");
      b.setAttribute("aria-label", dark ? "Тёмная тема" : "Светлая тема");
    });
  }
  document.addEventListener("vl:theme", syncTheme);
  syncTheme();

  // ---------------------------------------------------------------- вход
  function logout(msg) {
    secret = ""; sessionStorage.removeItem("vl_admin");
    $("panel").classList.add("hid"); $("login").classList.remove("hid");
    $("login-err").textContent = msg || ""; $("secret").value = "";
  }
  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const val = $("secret").value.trim(); if (!val) return;
    $("login-err").textContent = "";
    try {
      const res = await fetch("/api/admin/stats", { headers: { "X-Admin-Secret": val } });
      if (res.status === 429) { $("login-err").textContent = "Слишком много попыток. Подожди 10 минут."; return; }
      if (!res.ok) { $("login-err").textContent = "Неверный секрет"; return; }
      secret = val; sessionStorage.setItem("vl_admin", val);
      stats = await res.json(); enter();
    } catch (err) { $("login-err").textContent = "Сервер недоступен"; }
  });
  function enter() { $("login").classList.add("hid"); $("panel").classList.remove("hid"); show("overview"); }

  // ---------------------------------------------------------------- каркас
  async function refreshStats() {
    stats = await api("stats");
    $("demo-badge").classList.toggle("hid", !stats.config.demo);
    for (const [id, n] of [["cnt-payouts", stats.counts.pending_payouts], ["cnt-gifts", stats.counts.gift_withdrawals]]) {
      $(id).textContent = n; $(id).classList.toggle("hid", !n);
    }
  }
  async function show(name) {
    tab = name;
    document.querySelectorAll("#nav [data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
    const view = $("view");
    try { await refreshStats(); await VIEWS[name](view); }
    catch (e) { if (e.message !== "Forbidden") view.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  const table = (head, rows, empty) => rows.length
    ? `<div class="tbl-wrap"><table><thead><tr>${head.map((h) => `<th class="${h.startsWith("#") ? "num" : ""}">${esc(h.replace(/^#/, ""))}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`
    : `<div class="tbl-wrap"><div class="empty">${esc(empty)}</div></div>`;
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-filter="${key}" data-v="${v}" class="${filters[key] === v ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const tile = (lbl, val, unit, sub, cls) => `<div class="tile ${cls || ""}"><div class="lbl">${lbl}</div><div class="val">${val}<small>${unit || ""}</small></div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;

  // ---------------------------------------------------------------- разделы
  const VIEWS = {
    async overview(v) {
      const s = stats, r = s.revenue, rv = s.revenue_vdt, l = s.liabilities, c = s.counts, d = s.deposits;
      v.innerHTML = `
        <h2>Обзор</h2>
        ${s.config.demo ? `<div class="note">Сейчас <b>демо-режим</b>: VLD, VDT и подарки не настоящие, вход по слову «demo». В боевом режиме задай <span class="mono">BOT_TOKEN</span> и <span class="mono">ADMIN_SECRET</span>.</div>` : ""}
        <h3>Доход платформы</h3>
        <div class="tiles">
          ${tile("Сегодня · VLD", fmt(r.today), "VLD", "", "accent")}
          ${tile("За 7 дней · VLD", fmt(r.week), "VLD")}
          ${tile("За всё время · VLD", fmt(r.total), "VLD", `раунды ${fmt(r.by_source.rounds)} · переводы ${fmt(r.by_source.transfers)} · выводы ${fmt(r.by_source.payouts)}`)}
        </div>
        <div class="tiles">
          ${tile("Сегодня · VDT", fmtVdt(rv.today), "VDT", "", "accent")}
          ${tile("За 7 дней · VDT", fmtVdt(rv.week), "VDT")}
          ${tile("За всё время · VDT", fmtVdt(rv.total), "VDT", `раунды ${fmtVdt(rv.by_source.rounds)} · переводы ${fmtVdt(rv.by_source.transfers)} · выводы ${fmtVdt(rv.by_source.payouts)}`)}
          ${tile("Сборы за запуск раундов", fmtVdt(rv.create_fees), "VDT", "0.1 VDT с каждого раунда")}
        </div>
        <h3>Требует внимания</h3>
        <div class="tiles">
          ${tile("Заявки на вывод", c.pending_payouts, "", `на ${fmt(l.pending_payouts)} VLD и ${fmtVdt(l.pending_payouts_vdt)} VDT`, c.pending_payouts ? "accent" : "")}
          ${tile("Подарки ждут выдачи", c.gift_withdrawals, "", "выдаёт бот-хранитель")}
          ${tile("Депозиты TON в ожидании", d.ton_pending, "", "за последние 2 часа")}
        </div>
        <h3>Обязательства перед игроками</h3>
        <div class="tiles">
          ${tile("На балансах игроков · VLD", fmt(l.user_balances), "VLD", "могут быть выведены в Stars")}
          ${tile("На балансах игроков · VDT", fmtVdt(l.user_balances_vdt), "VDT", "могут быть выведены в TON")}
          ${tile("В банках живых раундов", fmt(l.locked_in_live_pools), "VLD", `и ${fmtVdt(l.locked_in_live_pools_vdt)} VDT · уйдут организаторам и в комиссию`)}
          ${tile("Резерв на передачу подарков", fmt(l.gift_fee_reserve), "VLD", "оплачено игроками заранее")}
        </div>
        <h3>Платформа</h3>
        <div class="tiles">
          ${tile("Игроков", fmt(c.users), "", c.banned ? `заблокировано: ${c.banned}` : "")}
          ${tile("Раундов", fmt(c.pools.live), "идёт", `завершено ${fmt(c.pools.finished)} · отменено ${fmt(c.pools.cancelled)}`)}
          ${tile("Подарков в эскроу", fmt(c.gifts_in_escrow))}
          ${tile("Получено TON", (d.ton_nano / 1e9).toFixed(2), "TON", `зачислено ${fmtVdt(d.ton_vdt_milli)} VDT · 1 TON = ${s.config.ton_to_vdt} VDT`)}
          ${tile("Выплачено в Stars", fmt(d.paid_out_vld), "VLD")}
          ${tile("Выплачено в TON", fmtVdt(d.paid_out_vdt), "VDT")}
        </div>
        <h3>Сверка депозитов TON</h3>
        <div class="toolbar"><button class="btn ghost" data-act="ton-scan">Проверить блокчейн сейчас</button>
          <span class="muted mono">${s.config.ton_wallet ? esc(s.config.ton_wallet) : "кошелёк платформы не задан (TON_WALLET_ADDRESS)"}</span></div>`;
    },

    async payouts(v) {
      const { items } = await api("payouts?status=" + filters.payouts);
      const rows = items.map((r) => {
        // способ (TON/Stars) — по method, формат суммы — по валюте: у старых TON-заявок currency = VLD
        const ton = r.method === "TON", vdt = r.currency === "VDT", nano = Math.round(r.net_ton * 1e9);
        const pay = ton ? `<a class="btn sm ghost" href="ton://transfer/${encodeURIComponent(r.destination)}?amount=${nano}&text=${encodeURIComponent("Vloody #" + r.id)}">Открыть кошелёк</a>` : "";
        const acts = r.status === "pending"
          ? `${pay}<button class="btn sm ok" data-payout="${r.id}" data-action="paid">Выплачено</button><button class="btn sm ghost" data-payout="${r.id}" data-action="reject">Отклонить</button>` : "";
        return `<tr>
          <td class="mono">#${r.id}</td>
          <td><button type="button" class="link" data-user="${r.telegram_id}">${esc(r.username ? "@" + r.username : r.telegram_id)}</button></td>
          <td>${ton ? "TON" : "Stars"} <span class="muted">· ${esc(r.currency)}</span></td>
          <td class="mono"><button type="button" class="link mono" data-copy="${esc(r.destination)}" title="Скопировать">${esc(r.destination)}</button></td>
          <td class="num">${fmtCur(r.amount, r.currency)} ${esc(r.currency)}</td>
          <td class="num"><b>${vdt ? fmtVdt(r.net) + " TON" : ton ? r.net_ton + " TON" : fmt(r.net) + " Stars"}</b><div class="muted">комиссия ${fmtCur(r.commission, r.currency)} ${esc(r.currency)}</div></td>
          <td>${pill(r.status, PO[r.status])}</td><td class="muted">${when(r.ts)}</td>
          <td><div class="acts">${acts}</div></td></tr>`;
      });
      v.innerHTML = `<h2>Заявки на вывод</h2>
        <div class="note"><b>Порядок:</b> сначала отправь деньги игроку, потом нажми «Выплачено». При «Отклонить» вся списанная сумма возвращается на баланс игрока. Перед выплатой открой игрока и проверь, откуда у него VLD или VDT. Stars выплачиваются из VLD, TON — из VDT.</div>
        <div class="toolbar">${seg("payouts", [["pending", "Ожидают"], ["paid", "Выплачены"], ["rejected", "Отклонены"], ["all", "Все"]])}</div>
        ${table(["ID", "Игрок", "Способ", "Куда", "#Списано", "#К выплате", "Статус", "Создана", ""], rows, "Заявок нет")}`;
    },

    async pools(v) {
      const { items } = await api("pools?status=" + filters.pools);
      const rows = items.map((p) => `<tr>
        <td class="mono">#${p.id}</td><td>${esc(p.emoji)} ${esc(p.title)}</td><td>${MODE[p.mode] || esc(p.mode)}</td>
        <td><button type="button" class="link" data-user="${p.organizer_tid}">${esc(p.organizer)}</button></td>
        <td class="num">${fmtCur(p.bank, p.currency)} ${esc(p.currency)}</td><td class="num">${p.participants} / ${p.entries}</td>
        <td>${pill(p.status, PL[p.status])}${p.winner ? ` <span class="muted">→ ${esc(p.winner)}</span>` : ""}</td>
        <td class="num">${p.status === "finished" ? fmtCur(p.commission, p.currency) : "—"}</td>
        <td class="muted">${p.status === "live" ? (p.ends_ts ? "до " + when(p.ends_ts) : "бессрочно") : when(p.created_ts)}</td>
        <td><div class="acts">${p.status === "live" ? `<button class="btn sm ghost" data-refund="${p.id}" data-bank="${esc(fmtCur(p.bank, p.currency) + " " + p.currency)}">Отменить с возвратом</button>` : ""}</div></td></tr>`);
      v.innerHTML = `<h2>Раунды</h2>
        <div class="note">«Отменить с возвратом» — аварийная мера для спорных раундов: <b>все ставки возвращаются игрокам</b>, подарок — организатору, комиссия не берётся. Результат честного раунда изменить нельзя.</div>
        <div class="toolbar">${seg("pools", [["live", "Идут"], ["finished", "Завершены"], ["cancelled", "Отменены"], ["all", "Все"]])}</div>
        ${table(["ID", "Подарок", "Режим", "Организатор", "#Банк", "#Игроков / ставок", "Статус", "#Комиссия", "Время", ""], rows, "Раундов нет")}`;
    },

    async users(v) {
      const { items } = await api("users?q=" + encodeURIComponent(filters.users));
      const rows = items.map((u) => `<tr>
        <td><button type="button" class="link" data-user="${u.telegram_id}">${esc(u.name)}</button>${u.banned ? " " + pill("banned", "бан") : ""}</td>
        <td class="mono">${u.telegram_id}</td><td class="num"><b>${fmt(u.balance)}</b> VLD<div class="muted">${fmtVdt(u.balance_vdt)} VDT</div></td>
        <td class="num">${fmt(u.staked)}</td><td class="num">${fmt(u.earned)}</td><td class="num">${u.level}</td>
        <td class="muted">${when(u.registered_ts)}</td>
        <td><div class="acts"><button class="btn sm ghost" data-ban="${u.telegram_id}" data-action="${u.banned ? "unban" : "ban"}">${u.banned ? "Разблокировать" : "Заблокировать"}</button></div></td></tr>`);
      v.innerHTML = `<h2>Игроки</h2>
        <form class="toolbar" id="user-search"><input class="inp" id="user-q" placeholder="Telegram ID или @username" value="${esc(filters.users)}">
          <button class="btn ghost" type="submit">Найти</button><span class="muted">показаны первые 50 по балансу</span></form>
        ${table(["Игрок", "Telegram ID", "#Баланс", "#Поставил", "#Получил как организатор", "#Уровень", "Регистрация", ""], rows, "Никого не найдено")}`;
      $("user-search").addEventListener("submit", (e) => { e.preventDefault(); filters.users = $("user-q").value.trim(); show("users"); });
    },

    async gifts(v) {
      const { items } = await api("gifts?status=" + filters.gifts);
      const rows = items.map((g) => `<tr>
        <td class="mono">#${g.id}</td><td>${esc(g.emoji)} ${esc(g.name)}</td>
        <td><button type="button" class="link" data-user="${g.owner_tid}">${esc(g.owner)}</button></td>
        <td>${pill(g.status, GS[g.status])}</td><td>${g.source === "win" ? "выигран" : "внесён"}</td>
        <td class="num">${g.transfer_fee || "—"}</td><td class="mono muted">${esc(g.tg_gift_id || "демо")}</td>
        <td class="muted">${when(g.created_ts)}</td></tr>`);
      v.innerHTML = `<h2>Подарки</h2>
        <div class="note">Подарки выдаёт <b>бот-хранитель</b> автоматически. Если заявка висит дольше нескольких минут — проверь, что бот запущен, бизнес-аккаунт подключён и на нём хватает звёзд на передачу.</div>
        <div class="toolbar">${seg("gifts", [["withdraw_requested", "Ждут выдачи"], ["held", "В инвентарях"], ["locked", "В раундах"], ["all", "Все"]])}</div>
        ${table(["ID", "Подарок", "Владелец", "Статус", "Происхождение", "#Плата за передачу", "ID в Telegram", "Получен"], rows, "Подарков нет")}`;
    },

    async revenue(v) {
      const d = await api("revenue");
      const rows = d.items.map((r) => `<tr><td class="muted">${when(r.ts)}</td><td>${esc(r.title)}</td><td class="num pos"><b>+${fmtCur(r.amount, r.currency)}</b> ${esc(r.currency)}</td></tr>`);
      const deps = d.ton_deposits.map((t) => `<tr><td class="muted">${when(t.ts)}</td><td>${esc(t.user)}</td>
        <td class="num">${t.ton.toFixed(2)} TON</td><td class="num">${fmtVdt(t.vld)}</td><td class="mono muted">${esc((t.tx_hash || "").slice(0, 22))}…</td></tr>`);
      v.innerHTML = `<h2>Доход</h2>
        <div class="tiles">${tile("Комиссия раундов", fmt(stats.revenue.by_source.rounds), "VLD")}${tile("Комиссия переводов", fmt(stats.revenue.by_source.transfers), "VLD")}${tile("Комиссия выводов", fmt(stats.revenue.by_source.payouts), "VLD")}${tile("Итого", fmt(stats.revenue.total), "VLD", "", "accent")}</div>
        <div class="tiles">${tile("Комиссия раундов", fmtVdt(stats.revenue_vdt.by_source.rounds), "VDT")}${tile("Комиссия переводов", fmtVdt(stats.revenue_vdt.by_source.transfers), "VDT")}${tile("Комиссия выводов", fmtVdt(stats.revenue_vdt.by_source.payouts), "VDT")}${tile("Сборы за запуск", fmtVdt(stats.revenue_vdt.create_fees), "VDT")}${tile("Итого комиссий", fmtVdt(stats.revenue_vdt.total), "VDT", "без сборов за запуск", "accent")}</div>
        <h3>Последние начисления</h3>${table(["Когда", "Источник", "#Сумма"], rows, "Дохода пока нет")}
        <h3>Депозиты TON</h3>${table(["Когда", "Игрок", "#Пришло", "#Зачислено VDT", "Транзакция"], deps, "Депозитов TON пока нет")}`;
    },
  };

  // ---------------------------------------------------------------- карточка игрока
  async function openUser(tid, body) {
    let u;
    try { u = await api("users/" + tid, body); } catch (e) { toast(e.message); return; }
    $("drawer-card").innerHTML = `
      <div class="drawer-head"><div><h2 style="margin:0">${esc(u.name)}</h2><span class="mono muted">ID ${u.telegram_id}</span>${u.banned ? " " + pill("banned", "заблокирован") : ""}</div>
        <button class="btn sm ghost" data-act="drawer-close">Закрыть</button></div>
      <div class="kv"><span>Баланс VLD</span><b>${fmt(u.balance)} VLD</b>
        <span>Баланс VDT</span><b>${fmtVdt(u.balance_vdt)} VDT</b>
        <span>Пригласил</span><span>${u.referred_by ? `<button type="button" class="link" data-user="${u.referred_by}">ID ${u.referred_by}</button>` : "—"}</span>
        <span>Реферальный доход</span><span>${fmt(u.referral_earned)} VLD</span></div>
      <button class="btn sm ghost" data-ban="${u.telegram_id}" data-action="${u.banned ? "unban" : "ban"}" data-drawer="1">${u.banned ? "Разблокировать" : "Заблокировать"}</button>
      <h3>Подарки</h3>
      ${u.gifts.length ? u.gifts.map((g) => `<div style="padding:4px 0">${esc(g.emoji)} ${esc(g.name)} ${pill(g.status, GS[g.status])}</div>`).join("") : `<div class="muted">нет</div>`}
      <h3>Последние операции</h3>
      ${u.ledger.length ? `<div class="tbl-wrap"><table><tbody>${u.ledger.map((r) => `<tr><td class="muted">${when(r.ts)}</td><td>${esc(r.title)}</td><td class="num ${r.amount >= 0 ? "pos" : "neg"}"><b>${r.amount >= 0 ? "+" : "−"}${fmtCur(Math.abs(r.amount), r.currency)}</b> ${esc(r.currency)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="muted">операций нет</div>`}`;
    $("drawer").classList.remove("hid");
  }

  // ---------------------------------------------------------------- события
  document.addEventListener("click", async (e) => {
    const t = (sel) => e.target.closest(sel);
    let el;
    if (e.target.id === "drawer") return $("drawer").classList.add("hid");
    if ((el = t("[data-tab]"))) return show(el.dataset.tab);
    if ((el = t("[data-filter]"))) { filters[el.dataset.filter] = el.dataset.v; return show(tab); }
    if ((el = t("[data-user]"))) return openUser(el.dataset.user);
    if ((el = t("[data-copy]"))) { try { await navigator.clipboard.writeText(el.dataset.copy); toast("Скопировано"); } catch (err) { toast(el.dataset.copy); } return; }
    if ((el = t("[data-act]"))) {
      const a = el.dataset.act;
      if (a === "logout") return logout();
      if (a === "theme") { if (window.VLTheme) window.VLTheme.toggle(); return syncTheme(); }
      if (a === "drawer-close") return $("drawer").classList.add("hid");
      if (a === "ton-scan") {
        el.disabled = true;
        try { const r = await api("ton/scan", {}); toast(r.credited ? `Зачислено депозитов: ${r.credited}` : "Новых переводов нет"); show(tab); }
        catch (err) { toast(err.message); el.disabled = false; }
      }
      return;
    }
    if ((el = t("[data-payout]"))) {
      const paid = el.dataset.action === "paid";
      if (!confirm(paid ? `Заявка #${el.dataset.payout}: деньги уже отправлены игроку? Отменить это будет нельзя.`
                        : `Отклонить заявку #${el.dataset.payout}? Сумма вернётся на баланс игрока.`)) return;
      try { await api("payouts/" + el.dataset.payout, { action: el.dataset.action }); toast(paid ? "Отмечено как выплаченное" : "Заявка отклонена, сумма возвращена"); show(tab); }
      catch (err) { toast(err.message); }
      return;
    }
    if ((el = t("[data-refund]"))) {
      if (!confirm(`Отменить раунд #${el.dataset.refund}? Игрокам вернётся ${el.dataset.bank}, подарок вернётся организатору. Отменить это будет нельзя.`)) return;
      try { const r = await api(`pools/${el.dataset.refund}/refund`, {}); toast("Раунд отменён, ставки возвращены"); show(tab); }
      catch (err) { toast(err.message); }
      return;
    }
    if ((el = t("[data-ban]"))) {
      const ban = el.dataset.action === "ban";
      if (ban && !confirm(`Заблокировать игрока ${el.dataset.ban}? Он не сможет ставить, создавать раунды, переводить и выводить.`)) return;
      if (el.dataset.drawer) await openUser(el.dataset.ban, { action: el.dataset.action });
      else { try { await api("users/" + el.dataset.ban, { action: el.dataset.action }); } catch (err) { toast(err.message); return; } }
      toast(ban ? "Игрок заблокирован" : "Игрок разблокирован");
      if (tab === "users") show("users");
    }
  });

  if (secret) refreshStats().then(enter).catch(() => {});
})();
</script>
</body>
</html>
