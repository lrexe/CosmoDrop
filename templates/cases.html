{% extends "base.html" %}
{% block title %}CosmoDrop — Кейсы{% endblock %}

{% block content %}
<section class="page-head reveal">
    <h1>Кейсы с подарками</h1>
    <p>Выбери кейс, изучи шансы и выбей редкий NFT-подарок.</p>
</section>

<section class="ticker reveal" id="drops-ticker" style="display:none">
    <div class="ticker-track" id="drops-track"></div>
</section>

<section class="cases-grid reveal" id="cases-grid">
    <div class="case-card skeleton" style="height:170px"></div>
    <div class="case-card skeleton" style="height:170px"></div>
    <div class="case-card skeleton" style="height:170px"></div>
    <div class="case-card skeleton" style="height:170px"></div>
</section>
{% endblock %}

{% block scripts %}
<div class="modal hidden" id="caseModal">
    <div class="modal-card" id="modalBody" style="position:relative"></div>
</div>
<script src="{{ url_for('static', filename='js/cases.js') }}"></script>
{% endblock %}
